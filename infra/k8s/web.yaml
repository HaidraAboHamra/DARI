apiVersion: apps/v1
kind: Deployment
metadata: { name: dari-web, namespace: dari }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 25% } }
  selector: { matchLabels: { app: dari-web } }
  template:
    metadata: { labels: { app: dari-web } }
    spec:
      containers:
        - name: web
          image: ghcr.io/dari/web:latest
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: dari-config } }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { memory: 768Mi }
          readinessProbe: { httpGet: { path: /manifest.webmanifest, port: 3000 }, periodSeconds: 5 }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: dari-web, namespace: dari }
spec:
  selector: { app: dari-web }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: dari-web, namespace: dari }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: dari-web }
  minReplicas: 3
  maxReplicas: 40
  metrics:
    - { type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }
