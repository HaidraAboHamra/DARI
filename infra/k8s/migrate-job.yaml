# Run before each rollout (e.g. Argo CD PreSync hook / Helm pre-upgrade). Migrations are idempotent.
apiVersion: batch/v1
kind: Job
metadata:
  name: dari-migrate
  namespace: dari
  annotations:
    argocd.argoproj.io/hook: PreSync
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/dari/api:latest
          command: ["node", "dist/infrastructure/database/migrate.js"]
          envFrom: [{ configMapRef: { name: dari-config } }, { secretRef: { name: dari-secrets } }]
