name: Build Android test APK

on:
  push:
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/build-mobile-apk.yml"
  workflow_dispatch:

permissions:
  contents: write # publish the APK as a downloadable release

jobs:
  build-apk:
    name: Build test APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Test build: the app asks for the API server address on first launch (see README).
      EXPO_PUBLIC_SERVER_SWITCH: '1'
      NODE_ENV: production
      CI: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts
        run: pnpm --filter @dari/contracts build

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive

      - name: Build installable release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dari-test-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk Dari-test.apk

      # A fixed public link that opens straight from a phone browser (no GitHub login, no zip):
      # https://github.com/HaidraAboHamra/DARI/releases/download/mobile-test/Dari-test.apk
      - name: Publish to the "mobile-test" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-test
          name: Dari — test app (Android)
          prerelease: true
          make_latest: false
          body: |
            نسخة اختبار من تطبيق داري لأندرويد — آخر بناء من ${{ github.ref_name }} (${{ github.sha }}).
            عند أول تشغيل اكتب عنوان الخادم. أرقام تجريبية: 0900000005 مواطن، 0900000002 تاجر، 0900000003 مندوب — الرمز 123456.
          files: Dari-test.apk
